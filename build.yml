name: build-module
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Get Zygisk API header
        run: |
          mkdir -p src
          curl -fsSL -o src/zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

      - name: Build module
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: badhon_game_profile
          path: badhon_game_profile.zip
          if-no-files-found: error
